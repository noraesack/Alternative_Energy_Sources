<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8 />
    <title>6</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <link href='http://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: whitesmoke;
            font-family: Lato, sans-serif;
            color: #0D0000;
        }
        header {
            padding: 6px 10%;
        }
        h1 {
            display: inline-block;
            margin-right: 20px;
            color: #001323;
        }
        h2 {
            display: inline-block;
            color: #001323;
        }
        #map {
            width: 80%;
            height: 540px;
            margin: 10px auto;
        }
        footer {
            padding: 6px 10%;
            width: 80%;
        }
        p {
            font-size: 1em;
            color: #001323;
        }
    </style>
</head>

<body>
    <header>
        <h1>US Electric Power Generation Sources</h1>
        <h2>Interactive map of US energy sources : Biomass, Geothermal, and Solar</h2>
    </header>

    <div id='map'></div>

    <footer>
        <p>Map authored by Nora Esack</p>
        <p>power plant data utalized for map </p>
    </footer>

    <script src="power-plants.js"></script>
    <script>

      var map = L.map('map', {
          center: [36,-94],
          zoom: 4,
      });
      
      var tiles = L.tileLayer('http://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="http://cartodb.com/attributions">CartoDB</a>',
          subdomains: 'abcd',
          maxZoom: 19
      });  
      
      tiles.addTo(map);
        
         
    //step 2
      
 //   plants.features.sort(function(a, b) {
   // return b.properties.capacity_mw - a.properties.capacity_mw;
//});
    
    //step 1    and then change to step 3 with 'return'

    var Biomass = L.geoJson(plants, {
    pointToLayer: function(feature,latlng) {
        return L.circleMarker(latlng, {
            color: 'blue',
            weight: 2,
            fillColor: 'aqua',
            fillOpacity: .5,
            radius: getRadius(feature.properties.capacity_mw)
        });   
    },
    
    filter: function(feature, layer){
        if(feature.properties.fuel_source['Nuclear']){
            return feature
        };
    },
    
    onEachFeature: function(feature,layer) {
        layer.on('mouseover', function() {
            layer.setStyle({
                fillColor: 'red'
            });
        });
        
        layer.on('mouseout', function() {
            layer.setStyle({
                fillColor: 'aqua'
            });
        });
        
        var name = feature.properties.plant_name;
        var capacity = feature.properties.capacity_mw.toLocaleString();
        var popup = "<b>"+name+"</b><br>"+capacity+" MW<br>";
        layer.bindPopup(popup);
    }
}).addTo(map);

var Geothermal = L.geoJson(plants, {
    pointToLayer: function(feature,latlng) {
        return L.circleMarker(latlng, {
            color: 'purple',
            weight: 2,
            fillColor: 'violet',
            fillOpacity: .5,
            radius: getRadius(feature.properties.capacity_mw)
        });   
    },
    
    filter: function(feature, layer){
        if(feature.properties.fuel_source['Geothermal']){
            return feature
        };
    },
    
    onEachFeature: function(feature,layer) {
        layer.on('mouseover', function() {
            layer.setStyle({
                fillColor: 'pink'
            });
        });
        
        layer.on('mouseout', function() {
            layer.setStyle({
                fillColor: 'violet'
            });
        });
        
        var name = feature.properties.plant_name;
        var capacity = feature.properties.capacity_mw.toLocaleString();
        var popup = "<b>"+name+"</b><br>"+capacity+" MW<br>";
        layer.bindPopup(popup);
    }
}).addTo(map);
var Solar = L.geoJson(plants, {
    pointToLayer: function(feature,latlng) {
        return L.circleMarker(latlng, {
            color: 'orange',
            weight: 2,
            fillColor: 'yellow',
            fillOpacity: .5,
            radius: getRadius(feature.properties.capacity_mw)
        });   
    },
    
    filter: function(feature, layer){
        if(feature.properties.fuel_source['Solar']){
            return feature
        };
    },
    
    onEachFeature: function(feature,layer) {
        layer.on('mouseover', function() {
            layer.setStyle({
                fillColor: 'pink'
            });
        });
        
        layer.on('mouseout', function() {
            layer.setStyle({
                fillColor: 'yellow'
            });
        });
        
        var name = feature.properties.plant_name;
        var capacity = feature.properties.capacity_mw.toLocaleString();
        var popup = "<b>"+name+"</b><br>"+capacity+" MW<br>";
        layer.bindPopup(popup);
    }
}).addTo(map);

var sourceLayers = {
    "<b style='color:blue'>Biomass</b>": Biomass,
     "<b style='color:purple'>Geothermal</b>": Geothermal,
      "<b style='color:orange'>Solar</b>": Solar
    
};
L.control.layers(null, sourceLayers, {collapsed:false} ).addTo(map);
//step 4
        function getRadius(area){
        var radius = Math.sqrt(area/Math.PI);
        return radius *.8   
    }
          
    </script>
    
</body>

</html>
